<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdlinkMark</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EdlinkMark">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login" hidden>
  <div id="checking" class="checking" hidden>Memeriksa sesi…</div>
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>EdlinkMark</h1>
    <p class="sub">Masuk dengan NIM dan kata sandi EdLink.</p>
    <div id="loginErr"></div>
    <div class="field">
      <label for="nim">NIM / Email</label>
      <input id="nim" type="text" placeholder="Contoh: 2024001234" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="pass">Kata sandi</label>
      <input id="pass" type="password" placeholder="Kata sandi EdLink" autocomplete="current-password" required>
    </div>
    <label class="remember">
      <input id="remember" type="checkbox" checked>
      <span>Ingat saya di perangkat ini (login otomatis)</span>
    </label>
    <button class="btn-primary" id="loginBtn" type="submit">Masuk</button>
  </form>
</section>

<!-- ================= APP ================= -->
<main id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>EdlinkMark</h1>
        <div class="user-card" id="userCard">
          <div class="user-name" id="whoName"></div>
          <div class="user-nim-row">
            <span class="user-nim" id="whoNim"></span>
            <button type="button" class="btn-copy" id="copyNim" title="Salin NIM">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Salin</span>
            </button>
          </div>
        </div>
      </div>
      <div class="who">
        <button class="btn-ghost" id="logout" type="button">Keluar</button>
      </div>
    </header>

    <nav class="tabs" id="mainTabs">
      <button class="tab active" type="button" data-view="posts">Postingan</button>
      <a class="tab" id="navFiles" href="files.html" style="text-decoration:none;display:inline-flex;align-items:center">Folder Berkas ↗</a>
      <a class="tab" id="navAnswer" href="answer.html" style="text-decoration:none;display:inline-flex;align-items:center">Lembar Jawaban ↗</a>
    </nav>

    <div id="viewPosts">
      <section class="block">
        <h2>Kuis &amp; tugas belum dikerjakan</h2>
        <div id="quizList"></div>
      </section>

      <div id="posts"><div class="loading">Memuat…</div></div>
    </div>
  </div>
</main>

<!-- ================= PRATINJAU BERKAS ================= -->
<div id="viewer" hidden>
  <div class="viewer-card" role="dialog" aria-modal="true" aria-labelledby="viewerName">
    <div class="viewer-head">
      <span class="name" id="viewerName"></span>
      <button class="btn-ghost" id="viewerClose" type="button">Tutup</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
    <div class="viewer-foot">
      <a class="link" id="viewerOpen" href="#" target="_blank" rel="noopener">Buka di tab baru</a>
      <button class="btn-ghost" id="viewerDl" type="button">Unduh</button>
    </div>
  </div>
</div>

<!-- ================= DETAIL POSTINGAN ================= -->
<div id="postModal" hidden>
  <div class="viewer-card" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <div class="viewer-head">
      <button class="btn-ghost" id="pmClose" type="button">← Kembali</button>
      <span class="name" id="pmTitle"></span>
    </div>
    <div class="modal-body" id="pmBody"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
