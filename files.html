<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdlinkMark — Berkas &amp; Folder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<script>
(function(){
  var from = sessionStorage.getItem('edlink_transfer_from');
  var transferTime = Number(sessionStorage.getItem('edlink_transfer_time')) || 0;
  var transferKey = sessionStorage.getItem('edlink_transfer_key');
  var authorized = sessionStorage.getItem('edlink_files_authorized');
  var isRecent = (Date.now() - transferTime) < 60000;
  if((from !== 'index.html' || !isRecent || !transferKey) && !authorized){
    location.replace('index.html');
  }
})();
</script>
<style>
  :root{
    --bg:#f4f4f2; --card:#ffffff; --ink:#111111; --muted:#6f6f6f;
    --line:#e3e3e0; --soft:#fafaf9; --hover:#f0f0ee;
    --gd:#0f9d58; --accent:#1a73e8;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button,input,select{font:inherit}
  button{cursor:pointer}
  a{color:var(--ink)}
  .wrap{max-width:880px;margin:0 auto;padding:24px 18px 70px}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
  .brand a.back{font-size:12.5px;text-decoration:none;color:var(--muted);border:1px solid var(--line);
                border-radius:6px;padding:4px 8px;background:var(--card)}
  .brand a.back:hover{border-color:var(--ink);color:var(--ink)}
  .actions{display:flex;align-items:center;gap:8px}
  .btn-ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);
             border-radius:8px;padding:7px 11px;font-size:12.5px}
  .btn-ghost:hover{background:var(--hover)}
  .btn-primary{padding:8px 14px;border-radius:8px;border:1px solid var(--ink);
               background:var(--ink);color:#fff;font-weight:600;font-size:13px}
  .btn-primary:hover{opacity:.9}

  /* Search & Filter Header */
  .search-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
  .search-row{display:flex;gap:8px;align-items:center}
  .search-input-wrap{position:relative;flex:1}
  .search-input-wrap input{width:100%;padding:10px 34px 10px 12px;border:1px solid var(--line);
                           border-radius:8px;background:var(--soft);font-size:14px;outline:none;
                           -webkit-appearance:none}
  .search-input-wrap input::-webkit-search-cancel-button,
  .search-input-wrap input::-webkit-search-decoration,
  .search-input-wrap input::-webkit-search-results-button,
  .search-input-wrap input::-webkit-search-results-decoration{
    -webkit-appearance:none;display:none
  }
  .search-input-wrap input:focus{border-color:var(--ink);background:var(--card)}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
                color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center}
  .search-clear:hover{color:var(--ink)}
  .filter-toggle{padding:8px 12px;border:1px solid var(--line);background:var(--card);
                 border-radius:8px;font-size:13px;display:flex;align-items:center;gap:6px}
  .filters{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
           display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .filter-group label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase}
  .filter-group select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
                       background:var(--card);font-size:12.5px;outline:none}
  .filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--soft);color:var(--muted);
        border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .stats-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}

  /* Main Category Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{border:0;background:none;padding:10px 14px;color:var(--muted);font-size:14px;
       border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
  .tab .count{background:var(--soft);border:1px solid var(--line);padding:1px 6px;
              border-radius:999px;font-size:11px;font-weight:600}
  .tab.active .count{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* Folder Hierarchy */
  .folder-tree{display:flex;flex-direction:column;gap:12px}
  .course-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .course-head{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;
               background:var(--card);font-weight:600;font-size:14.5px;user-select:none}
  .course-head::-webkit-details-marker{display:none}
  .course-head::before{content:'▸';font-size:11px;color:var(--muted);transition:transform .15s}
  details[open].course-card>.course-head::before{transform:rotate(90deg)}
  .course-head .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .course-head .cmeta{font-size:12px;color:var(--muted);font-weight:400;flex-shrink:0;white-space:nowrap}

  .course-body{border-top:1px solid var(--line);padding:8px 12px 12px;background:#fcfcfb;display:flex;flex-direction:column;gap:8px}
  .sess-card{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .sess-head{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;
             font-size:13.5px;font-weight:600;user-select:none}
  .sess-head::-webkit-details-marker{display:none}
  .sess-head::before{content:'▸';font-size:10px;color:var(--muted);transition:transform .15s}
  details[open].sess-card>.sess-head::before{transform:rotate(90deg)}
  .sess-head .sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess-head .smeta{font-size:11.5px;color:var(--muted);font-weight:400;flex-shrink:0;white-space:nowrap}

  .sess-files{padding:4px 12px 10px;display:flex;flex-direction:column;gap:6px}
  .file-item{display:flex;align-items:center;justify-content:space-between;gap:12px;
             padding:8px 10px;background:var(--soft);border:1px solid var(--line);border-radius:8px}
  .file-item:hover{background:#fff;border-color:#ccc}
  .file-main{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
  .file-logo-img{width:24px;height:24px;object-fit:contain;flex:0 0 24px}
  .file-info{min-width:0}
  .file-name{font-size:13.5px;font-weight:500;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .file-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .file-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .file-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
            border-radius:6px;padding:5px 9px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .file-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* Modal / Viewer */
  .modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;
         align-items:center;justify-content:center;padding:16px}
  .modal-card{width:100%;max-width:820px;max-height:90vh;display:flex;flex-direction:column;
              background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-body{flex:1;overflow:auto;padding:14px 16px;background:var(--soft)}
  .modal-body iframe{width:100%;height:68vh;border:0;background:#fff;border-radius:6px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
  .empty-state{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;
         background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px}
  /* View Mode Toggle */
  .view-toggle{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px}
  .view-btn{border:0;background:none;color:var(--muted);padding:5px 9px;border-radius:6px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .view-btn.active{background:var(--ink);color:#fff;font-weight:600}
  .view-btn:not(.active):hover{color:var(--ink);background:var(--hover)}

  /* Google Drive Folder Mode */
  .gdrive-wrap{display:flex;flex-direction:column;gap:12px}
  .gdrive-crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
  .gdrive-crumb-btn{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--accent);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:4px}
  .gdrive-crumb-btn:hover{background:var(--hover);text-decoration:underline}
  .gdrive-crumb-sep{color:var(--muted);font-size:12px;user-select:none;padding:0 2px}
  .gdrive-crumb-current{color:var(--ink);font-weight:600;padding:4px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;display:inline-flex;align-items:center;gap:4px}
  .gdrive-section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}
  .gdrive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .gdrive-folder-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
  .gdrive-folder-card:hover{background:var(--hover);border-color:#bbb}
  .gdrive-folder-icon{width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center}
  .gdrive-folder-info{flex:1;min-width:0}
  .gdrive-folder-name{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gdrive-folder-meta{font-size:11.5px;color:var(--muted);margin-top:2px}

  @media(max-width:640px){
    .wrap{padding:14px 12px 50px}
    .brand h1{font-size:18px}
    .search-box{padding:10px 12px;margin-bottom:12px}
    .filters{grid-template-columns:1fr;gap:8px}
    .filter-chips .chip[data-chip="reset"]{margin-left:0}
    .stats-bar{flex-direction:column;align-items:flex-start;gap:3px}
    .tabs{gap:2px;margin-bottom:12px}
    .tab{flex:1;justify-content:center;padding:9px 6px;font-size:13px}
    .course-head{padding:10px 12px;font-size:13.5px}
    .course-body{padding:6px 8px 10px;gap:6px}
    .sess-head{padding:8px 10px;font-size:12.5px}
    .sess-files{padding:4px 6px 8px;gap:6px}
    .file-item{flex-direction:column;align-items:stretch;gap:8px;padding:9px 10px}
    .file-actions{display:flex;width:100%;gap:6px;border-top:1px dashed var(--line);padding-top:6px}
    .file-btn{flex:1;justify-content:center;padding:6px 10px}
    .modal{padding:0}
    .modal-card{max-height:100vh;height:100%;border:0;border-radius:0}
    .modal-head{padding:10px 14px}
    .modal-body{padding:10px 12px}
    .modal-body iframe{height:calc(100dvh - 112px);height:calc(100vh - 112px)}
    .modal-foot{padding:8px 12px}
    .gdrive-grid{grid-template-columns:1fr;gap:8px}
    .gdrive-crumb-current{max-width:160px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <a href="index.html" class="back" style="display:inline-flex;align-items:center;gap:4px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Beranda</span>
      </a>
      <h1>Folder Berkas</h1>
    </div>
    <div class="view-toggle" role="tablist" aria-label="Mode Tampilan">
      <button type="button" class="view-btn active" id="btnModeList" data-mode="list" role="tab" aria-selected="true" title="Mode List">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>List</span>
      </button>
      <button type="button" class="view-btn" id="btnModeFolder" data-mode="folder" role="tab" aria-selected="false" title="Mode Folder (Drive)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>Folder</span>
      </button>
    </div>
  </header>

  <!-- Search & Filter Area -->
  <section class="search-box">
    <div class="search-row">
      <div class="search-input-wrap">
        <input id="q" type="text" placeholder="Cari nama berkas, judul materi/tugas, sesi, mata kuliah, ekstensi..." autocomplete="off">
        <button id="qClear" class="search-clear" type="button" title="Hapus pencarian" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <button class="filter-toggle" id="btnFilterToggle" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span>Filter</span>
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <div class="filters" id="filterPanel" hidden>
      <div class="filter-group">
        <label for="fCourse">Mata Kuliah</label>
        <select id="fCourse"><option value="">Semua Mata Kuliah</option></select>
      </div>
      <div class="filter-group">
        <label for="fSess">Sesi / Pertemuan</label>
        <select id="fSess">
          <option value="">Semua Sesi</option>
          <option value="1">Sesi 1</option><option value="2">Sesi 2</option>
          <option value="3">Sesi 3</option><option value="4">Sesi 4</option>
          <option value="5">Sesi 5</option><option value="6">Sesi 6</option>
          <option value="7">Sesi 7</option><option value="8">Sesi 8</option>
          <option value="9">Sesi 9</option><option value="10">Sesi 10</option>
          <option value="11">Sesi 11</option><option value="12">Sesi 12</option>
          <option value="13">Sesi 13</option><option value="14">Sesi 14</option>
          <option value="15">Sesi 15</option><option value="16">Sesi 16</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fType">Tipe / Format</label>
        <select id="fType">
          <option value="">Semua Format</option>
          <option value="gdrive">Google Drive</option>
          <option value="pdf">PDF</option>
          <option value="doc">Dokumen (Word/PPT/Excel)</option>
          <option value="video">Video (MP4/YouTube)</option>
          <option value="other">Lainnya</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="fSort">Urutkan Berkas</label>
        <select id="fSort">
          <option value="sess-asc">Sesi (1 → 16)</option>
          <option value="sess-desc">Sesi (16 → 1)</option>
          <option value="name-asc">Nama Berkas (A-Z)</option>
          <option value="date-desc">Waktu Terbaru</option>
          <option value="size-desc">Ukuran Terbesar</option>
        </select>
      </div>
    </div>

    <div class="filter-chips">
      <span class="chip" data-chip="gdrive">
        <img src="https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png" width="13" height="13" alt="Drive" style="vertical-align:middle;margin-right:4px">Hanya Google Drive
      </span>
      <span class="chip" data-chip="expand">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span id="txtExpand">Buka Semua Folder</span>
      </span>
      <span class="chip" data-chip="reset" style="margin-left:auto;color:#c5221f">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset Filter
      </span>
    </div>
    <div class="stats-bar">
      <span id="statText">Memuat berkas…</span>
      <span id="userStatus"></span>
    </div>
  </section>

  <!-- 3 Tabs: Materi, Tugas, Other -->
  <nav class="tabs" id="catTabs">
    <button class="tab active" type="button" data-cat="materi">
      Materi <span class="count" id="cMateri">0</span>
    </button>
    <button class="tab" type="button" data-cat="tugas">
      Tugas <span class="count" id="cTugas">0</span>
    </button>
    <button class="tab" type="button" data-cat="other">
      Other <span class="count" id="cOther">0</span>
    </button>
  </nav>

  <!-- Folder Tree View -->
  <main id="folderContainer" class="folder-tree">
    <div class="empty-state">Menghubungkan ke API EdLink…</div>
  </main>
</div>

<!-- Modal Viewer -->
<div id="viewerModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="viewerTitle">Pratinjau Berkas</h3>
      <button class="btn-ghost" id="viewerClose" type="button">Tutup</button>
    </div>
    <div class="modal-body" id="viewerContent"></div>
    <div class="modal-foot">
      <a class="btn-ghost" id="viewerExt" href="#" target="_blank" rel="noopener">Buka Tautan</a>
      <button class="btn-primary" id="viewerDl" type="button">Unduh</button>
    </div>
  </div>
</div>


<script>
(function(){
  'use strict';
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === 'file:';
  var BASE  = LOCAL ? 'https://kuliah.unsia.ac.id/api/v1.4' : '/api/v1.4';
  var APP_ID = '031068';
  var KEY   = 'edlink_apikey';
  var CRED  = 'edlink_creds';

  var token = '';
  var transferKey = sessionStorage.getItem('edlink_transfer_key');
  if(transferKey){
    token = transferKey;
    sessionStorage.setItem('edlink_files_authorized', '1');
    sessionStorage.setItem('edlink_active_token', token);
    sessionStorage.removeItem('edlink_transfer_key');
    sessionStorage.removeItem('edlink_transfer_from');
    sessionStorage.removeItem('edlink_transfer_time');
  }else{
    token = sessionStorage.getItem('edlink_active_token') || localStorage.getItem(KEY) || '';
  }

  function getCreds(){
    try{
      var raw = localStorage.getItem(CRED);
      if(!raw) return null;
      var o = JSON.parse(atob(raw));
      return (o && o.u && o.p) ? o : null;
    }catch(e){ return null; }
  }

  function findToken(obj, depth){
    depth = depth || 0;
    if(!obj || typeof obj !== 'object' || depth > 3) return null;
    if(typeof obj.token === 'string' && obj.token.length >= 20) return obj.token;
    var keys = ['userToken','member','user','account'];
    for(var i = 0; i < keys.length; i++){
      var t = findToken(obj[keys[i]], depth + 1);
      if(t) return t;
    }
    return null;
  }

  var reloginPromise = null;
  function tryRelogin(){
    if(reloginPromise) return reloginPromise;
    reloginPromise = (async function(){
      var creds = getCreds();
      if(!creds) return false;
      try{
        var device = JSON.stringify({
          secureId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
          name: 'Chrome', manufacture: 'Google', model: 'Chrome', product: 'Chrome',
          hardware: 'Linux', version: (navigator.userAgent.match(/Chrome\/([\d.]+)/) || [])[1] || '',
          regId: null
        });
        var res = await fetch(BASE + '/site/login', {
          method: 'POST',
          headers: {

            'Content-Type': 'application/json',
            'X-App-Locale': 'id',
            'X-Referer': 'https://kuliah.unsia.ac.id/'
          },
          body: JSON.stringify({
            username: creds.u, app_id: APP_ID, email: '', password: creds.p,
            web_reg_id: null, device: device
          })
        });
        var json = await res.json();
        var sys = (json && json.applicationSystem) || {};
        var tok = (json && json.data && json.data.userToken && json.data.userToken.token) || findToken(json && json.data);
        if(sys.code === 0 && tok){
          token = tok;
          try{
            localStorage.setItem(KEY, token);
            sessionStorage.setItem('edlink_active_token', token);
            sessionStorage.setItem('edlink_files_authorized', '1');
          }catch(e){}
          return true;
        }
      }catch(e){}
      return false;
    })().finally(function(){
      reloginPromise = null;
    });
    return reloginPromise;
  }

  async function api(path, body){
    if(!token){
      var ok = await tryRelogin();
      if(!ok){
        location.replace('index.html');
        throw new Error('Sesi berakhir.');
      }
    }
    var headers = {
      'Accept': 'application/json',
      'Content-Type': 'application/json',
      'X-App-Locale': 'id',
      'X-Referer': 'https://kuliah.unsia.ac.id/'
    };
    if(token) headers['Authorization'] = 'Bearer ' + token;
    var res, json;
    try{
      res = await fetch(BASE + path, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body || {})
      });
      json = await res.json();
    }catch(err){
      location.replace('index.html');
      throw err;
    }
    if(json && json.applicationSystem && json.applicationSystem.code === 2){
      var ok2 = await tryRelogin();
      if(ok2){
        headers['Authorization'] = 'Bearer ' + token;
        try{
          res = await fetch(BASE + path, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(body || {})
          });
          json = await res.json();
          if(!json || (json.applicationSystem && json.applicationSystem.code === 2)){
            location.replace('index.html');
            throw new Error('Sesi berakhir.');
          }
          return json;
        }catch(err){
          location.replace('index.html');
          throw err;
        }
      }
      location.replace('index.html');
      throw new Error('Sesi berakhir atau token tidak valid.');
    }
    return json;
  }


  function driveId(url){
    if(!url) return '';
    var m = String(url).match(/(?:drive|docs)\.google\.com\/(?:[^\s"'<>]*(?:\/d\/|\/folders\/|id=))([\w-]{10,})/i);
    return m ? m[1] : '';
  }

  function getDriveDownloadUrl(id){
    return 'https://drive.google.com/uc?export=download&id=' + id;
  }

  function getDrivePreviewUrl(id){
    return 'https://drive.google.com/file/d/' + id + '/preview';
  }

  function detectType(m, url){
    if(driveId(url)) return 'gdrive';
    var ext = String(m.extension || '').toLowerCase().replace(/^\./, '');
    if(!ext){
      var match = url.split(/[?#]/)[0].match(/\.([a-z0-9]+)$/i);
      ext = match ? match[1].toLowerCase() : '';
    }
    if(ext === 'pdf') return 'pdf';
    if(/^(docx?|pptx?|xlsx?|rtf|odt|ods|odp)$/.test(ext)) return 'doc';
    if(/^(mp4|mkv|webm|mov|avi|youtube)$/.test(ext) || /youtu\.?be/.test(url)) return 'video';
    return 'other';
  }

  function formatSize(n){
    n = Number(n)||0;
    if(n >= 1048576) return (n/1048576).toFixed(1) + ' MB';
    if(n >= 1024) return Math.round(n/1024) + ' KB';
    return n ? n + ' B' : '';
  }

  function mediaUrl(m){
    var l = m.link || '';
    var f = (m.file && m.file.link) || '';
    if(driveId(l)) return l;
    if(driveId(f)) return f;
    if(/^(youtube|gdrive|drive|link)$/i.test(String(m.type || ''))) return l || f;
    return l || f;
  }

  // Extract all media items from posts
  function extractItems(posts){
    var items = [];
    posts.forEach(function(p){
      var groupName = (p.group && p.group.name) || 'Mata Kuliah Umum';
      var groupId   = (p.group && p.group.id) || '0';
      var secMeet   = (p.section && p.section.meet) ? Number(p.section.meet) : 0;
      var secName   = (p.section && (p.section.title || p.section.name)) || (secMeet ? ('Sesi ' + secMeet) : 'Sesi Umum');
      var cat       = categoryOf(p.type);

      // Media attachments
      var medias = p.medias || [];
      medias.forEach(function(m){
        var l = m.link || '';
        var f = (m.file && m.file.link) || '';
        var url = mediaUrl(m);
        if(!url) return;
        var gd = driveId(url) || driveId(l) || driveId(f);
        if(gd && !driveId(url)){
          url = driveId(l) ? l : f;
        }
        var t = gd ? 'gdrive' : detectType(m, url);
        items.push({
          id: m.id || String(Math.random()),
          name: m.name || p.title || 'Berkas',
          url: url,
          driveId: gd,
          type: t,
          extension: m.extension || (m.file && m.file.extension) || '',
          mime: m.mime || (m.file && m.file.mime) || '',
          cat: cat,
          size: m.size || (m.file && m.file.size) || 0,
          postTitle: p.title || '',
          groupId: groupId,
          groupName: groupName,
          secMeet: secMeet,
          secName: secName,
          createdAt: p.createdAt || 0
        });
      });

      // Extract inline Google Drive / link in description if no direct media
      if(p.description && typeof p.description === 'string'){
        var driveMatches = p.description.match(/https?:\/\/(?:drive|docs)\.google\.com\/[^\s"'<>]+/gi) || [];
        driveMatches.forEach(function(dUrl){
          // avoid duplicates
          if(medias.some(function(m){ return mediaUrl(m) === dUrl; })) return;
          var gd = driveId(dUrl);
          if(!gd) return;
          items.push({
            id: 'desc-' + gd,
            name: p.title || 'Tautan Google Drive',
            url: dUrl,
            driveId: gd,
            type: 'gdrive',
            cat: cat,
            size: 0,
            postTitle: p.title || '',
            groupId: groupId,
            groupName: groupName,
            secMeet: secMeet,
            secName: secName,
            createdAt: p.createdAt || 0
          });
        });
      }
    });
    return items;
  }

  function downloadItem(item, btn){
    var url = item.driveId ? getDriveDownloadUrl(item.driveId) : item.url;
    var name = item.name;
    var oldText = btn.textContent;
    btn.textContent = 'Mengunduh…';
    btn.disabled = true;

    fetch(url).then(function(r){
      if(!r.ok) throw new Error();
      return r.blob();
    }).then(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name || 'berkas';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
      btn.textContent = 'Terunduh';
    }).catch(function(){
      window.open(url, '_blank', 'noopener');
      btn.textContent = oldText;
    }).finally(function(){
      btn.disabled = false;
      setTimeout(function(){ btn.textContent = oldText; }, 2000);
    });
  }

  var activeViewBlob = '';
  var viewSeq = 0;
  function cleanupViewer(){
    viewSeq++;
    if(activeViewBlob){
      URL.revokeObjectURL(activeViewBlob);
      activeViewBlob = '';
    }
    var body = $('viewerContent');
    if(body) body.innerHTML = '';
  }

  function openViewer(item){
    cleanupViewer();
    var curSeq = viewSeq;
    var modal = $('viewerModal');
    var title = $('viewerTitle');
    var body  = $('viewerContent');
    var extLink = $('viewerExt');
    var dlBtn = $('viewerDl');

    title.textContent = item.name;
    modal.hidden = false;

    var url = item.url;
    var gd = item.driveId || driveId(url);

    // 1. Google Drive: pratinjau via iframe Google Drive Preview
    if(gd){
      var ifr = document.createElement('iframe');
      ifr.src = 'https://drive.google.com/file/d/' + gd + '/preview';
      ifr.title = item.name;
      ifr.allow = 'autoplay';
      ifr.allowFullscreen = true;
      body.appendChild(ifr);
      extLink.href = 'https://drive.google.com/file/d/' + gd + '/view';
      dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
      return;
    }

    // 2. YouTube
    var yt = (url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/))([\w-]{11})/i)||[])[1];
    if(yt){
      var ifr = document.createElement('iframe');
      ifr.src = 'https://www.youtube.com/embed/' + yt + '?rel=0';
      ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      ifr.allowFullscreen = true;
      body.appendChild(ifr);
      extLink.href = url;
      dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
      return;
    }

    var ext = String(item.extension || (item.name.match(/\.([a-z0-9]+)$/i)||[])[1] || '').toLowerCase();

    // 3. Gambar
    if(/^(png|jpe?g|gif|webp|svg|bmp|avif)$/.test(ext)){
      var img = document.createElement('img');
      img.src = url;
      img.alt = item.name;
      img.style.maxWidth = '100%';
      img.style.maxHeight = '72vh';
      img.style.objectFit = 'contain';
      img.style.display = 'block';
      img.style.margin = '0 auto';
      body.appendChild(img);
      extLink.href = url;
      dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
      return;
    }

    // 4. Video
    if(/^(mp4|webm|ogv|mov|m4v)$/.test(ext) || item.type === 'video'){
      var v = document.createElement('video');
      v.src = url;
      v.controls = true;
      v.playsInline = true;
      v.style.maxWidth = '100%';
      v.style.maxHeight = '72vh';
      v.style.display = 'block';
      v.style.margin = '0 auto';
      body.appendChild(v);
      extLink.href = url;
      dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
      return;
    }

    // 5. Audio
    if(/^(mp3|wav|m4a|aac|ogg)$/.test(ext)){
      var a = document.createElement('audio');
      a.src = url;
      a.controls = true;
      a.style.width = '100%';
      a.style.margin = '40px 0';
      body.appendChild(a);
      extLink.href = url;
      dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
      return;
    }

    // 6. PDF: Fetch sebagai Blob untuk meniadakan Content-Disposition attachment
    if(ext === 'pdf' || item.type === 'pdf'){
      var ifr = document.createElement('iframe');
      ifr.title = item.name;

      var loadMsg = document.createElement('div');
      loadMsg.style.textAlign = 'center';
      loadMsg.style.padding = '30px 10px';
      loadMsg.style.color = 'var(--muted)';
      loadMsg.textContent = 'Memuat pratinjau PDF…';
      body.appendChild(loadMsg);

      fetch(url).then(function(r){
        if(!r.ok) throw new Error();
        return r.blob();
      }).then(function(b){
        if(curSeq !== viewSeq) return;
        activeViewBlob = URL.createObjectURL(new Blob([b], { type: 'application/pdf' }));
        ifr.src = activeViewBlob;
        loadMsg.remove();
        body.appendChild(ifr);
      }).catch(function(){
        if(curSeq !== viewSeq) return;
        loadMsg.remove();
        ifr.src = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(url);
        body.appendChild(ifr);
      });

      extLink.href = url;
      dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
      return;
    }

    // 7. Dokumen Office & Lainnya: Google Docs Viewer
    var ifr = document.createElement('iframe');
    ifr.src = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(url);
    ifr.title = item.name;
    body.appendChild(ifr);
    extLink.href = url;
    dlBtn.onclick = function(){ downloadItem(item, dlBtn); };
  }
  function getFileLogo(item){
    if(item.driveId) return 'https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png';
    var ext = String(item.extension || (item.name.match(/\.([a-z0-9]+)$/i)||[])[1] || '').toLowerCase();
    if(ext === 'pdf' || item.type === 'pdf') return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_pdf.svg';
    if(/^(docx?|rtf|odt)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_word.svg';
    if(/^(pptx?|odp)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_powerpoint.svg';
    if(/^(xlsx?|csv|ods)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_excel.svg';
    if(item.type === 'video' || /^(mp4|mkv|webm|mov|avi)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_video.svg';
    if(/^(zip|rar|7z|tar|gz)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_zip.svg';
    if(/^(png|jpe?g|gif|webp|svg|bmp)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_image.svg';
    if(/^(mp3|wav|m4a|aac|ogg)$/.test(ext)) return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/file_type_audio.svg';
    return 'https://cdn.jsdelivr.net/gh/vscode-icons/vscode-icons/icons/default_file.svg';
  }

  function renderTree(){
    var container = $('folderContainer');
    var q = state.q.toLowerCase().trim();
    var isSearching = q.length > 0;

    // Sembunyikan 3 tab folder saat pencarian aktif
    var catTabs = $('catTabs');
    if(catTabs) catTabs.hidden = isSearching;

    // Filter items (saat search, mencari di semua kategori)
    var list = state.items.filter(function(it){
      if(!isSearching && state.activeCat && it.cat !== state.activeCat) return false;
      if(state.onlyGdrive && it.type !== 'gdrive') return false;
      if(state.courseFilter && String(it.groupId) !== String(state.courseFilter)) return false;
      if(state.sessFilter && String(it.secMeet) !== String(state.sessFilter)) return false;
      if(state.typeFilter && it.type !== state.typeFilter) return false;
      if(isSearching){
        var match = it.name.toLowerCase().includes(q) ||
                    it.groupName.toLowerCase().includes(q) ||
                    it.secName.toLowerCase().includes(q) ||
                    it.postTitle.toLowerCase().includes(q) ||
                    it.type.includes(q);
        if(!match) return false;
      }
      return true;
    });

    // Update Tab Counters
    var totalMateri = state.items.filter(function(i){ return i.cat === 'materi'; }).length;
    var totalTugas  = state.items.filter(function(i){ return i.cat === 'tugas'; }).length;
    var totalOther  = state.items.filter(function(i){ return i.cat === 'other'; }).length;
    $('cMateri').textContent = totalMateri;
    $('cTugas').textContent  = totalTugas;
    $('cOther').textContent  = totalOther;

    $('statText').textContent = isSearching
      ? ('Menemukan ' + list.length + ' berkas di semua folder')
      : ('Menampilkan ' + list.length + ' berkas');
    updateModeButtons();


    if(!list.length){
      container.innerHTML = '<div class="empty-state">Tidak ada berkas yang cocok dengan pencarian / filter ini.</div>';
      return;
    }

    // JIKA SEDANG SEARCH: Tampilkan semua file langsung tanpa folder
    if(isSearching){
      container.innerHTML = '';
      var searchWrap = document.createElement('div');
      searchWrap.style.display = 'flex';
      searchWrap.style.flexDirection = 'column';
      searchWrap.style.gap = '8px';

      // Urutkan hasil pencarian
      var searchItems = list.slice();
      if(state.sort === 'name-asc') searchItems.sort(function(a,b){ return a.name.localeCompare(b.name); });
      else if(state.sort === 'date-desc') searchItems.sort(function(a,b){ return b.createdAt - a.createdAt; });
      else if(state.sort === 'size-desc') searchItems.sort(function(a,b){ return b.size - a.size; });
      else if(state.sort === 'sess-desc') searchItems.sort(function(a,b){ return b.secMeet - a.secMeet; });
      else if(state.sort === 'sess-asc')  searchItems.sort(function(a,b){ return a.secMeet - b.secMeet; });

      searchItems.forEach(function(item){
        searchWrap.appendChild(createFileRow(item, true));
      });
      container.appendChild(searchWrap);
      return;
    }
    // JIKA MODE FOLDER (GDRIVE)
    if(state.viewMode === 'folder'){
      renderFolderMode(list, container);
      return;
    }


    // JIKA TIDAK SEDANG SEARCH: Tampilkan berjenjang Matakuliah -> Sesi
    var byCourse = {};
    list.forEach(function(it){
      if(!byCourse[it.groupName]) byCourse[it.groupName] = { id: it.groupId, sessions: {} };
      var sKey = it.secMeet || 999;
      if(!byCourse[it.groupName].sessions[sKey]){
        byCourse[it.groupName].sessions[sKey] = { name: it.secName, meet: it.secMeet, items: [] };
      }
      byCourse[it.groupName].sessions[sKey].items.push(it);
    });

    container.innerHTML = '';
    var courseNames = Object.keys(byCourse).sort();

    courseNames.forEach(function(cName){
      var cData = byCourse[cName];
      var cDetails = document.createElement('details');
      cDetails.className = 'course-card';
      if(state.allExpanded) cDetails.open = true;

      var cSummary = document.createElement('summary');
      cSummary.className = 'course-head';
      var sessKeys = Object.keys(cData.sessions);
      var fileCount = sessKeys.reduce(function(acc, k){ return acc + cData.sessions[k].items.length; }, 0);

      cSummary.innerHTML = '<span class="cicon" style="display:inline-flex;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>' +
        '<span class="cname">' + cName + '</span>' +
        '<span class="cmeta">' + sessKeys.length + ' Sesi · ' + fileCount + ' Berkas</span>';
      cDetails.appendChild(cSummary);

      var cBody = document.createElement('div');
      cBody.className = 'course-body';

      // Sort sessions
      var sortedSess = sessKeys.map(Number).sort(function(a,b){
        return state.sort === 'sess-desc' ? b - a : a - b;
      });

      sortedSess.forEach(function(sKey){
        var sData = cData.sessions[sKey];
        var sDetails = document.createElement('details');
        sDetails.className = 'sess-card';
        if(state.allExpanded) sDetails.open = true;

        var sSummary = document.createElement('summary');
        sSummary.className = 'sess-head';
        sSummary.innerHTML = '<span class="sicon" style="display:inline-flex;align-items:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg></span>' +
          '<span class="sname">' + sData.name + '</span><span class="smeta">' + sData.items.length + ' Berkas</span>';
        sDetails.appendChild(sSummary);

        var fileWrap = document.createElement('div');
        fileWrap.className = 'sess-files';

        var items = sData.items.slice();
        if(state.sort === 'name-asc') items.sort(function(a,b){ return a.name.localeCompare(b.name); });
        else if(state.sort === 'date-desc') items.sort(function(a,b){ return b.createdAt - a.createdAt; });
        else if(state.sort === 'size-desc') items.sort(function(a,b){ return b.size - a.size; });

        items.forEach(function(item){
          fileWrap.appendChild(createFileRow(item, false));
        });

        sDetails.appendChild(fileWrap);
        cBody.appendChild(sDetails);
      });

      cDetails.appendChild(cBody);
      container.appendChild(cDetails);
    });
  }

  async function loadData(){
    $('statText').textContent = 'Mengambil daftar kelas…';
    try{
      var profile = await api('/user/profile');
      if(profile.data){
        $('userStatus').textContent = profile.data.name || '';
      }
      var periods = await api('/university/periods');
      var active = (periods.data || []).find(function(p){ return p.status === 1; });

      var groupsRes = await api('/group/all');
      var allGroups = (groupsRes.data && groupsRes.data.data) || [];
      state.groups = active
        ? allGroups.filter(function(g){ return String(g.periode) === String(active.value); })
        : allGroups;

      // Populate course filter dropdown
      var fCourse = $('fCourse');
      fCourse.innerHTML = '<option value="">Semua Mata Kuliah</option>';
      state.groups.forEach(function(g){
        var opt = document.createElement('option');
        opt.value = g.id; opt.textContent = g.name;
        fCourse.appendChild(opt);
      });

      // Load all posts across groups concurrently
      $('statText').textContent = 'Memuat berkas dari ' + state.groups.length + ' mata kuliah…';
      var allPosts = [];
      await Promise.all(state.groups.map(async function(g){
        try{
          var r = await api('/post/group/' + g.id);
          var list = (r.data && r.data.data) || [];
          list.forEach(function(p){
            allPosts.push(Object.assign({}, p, { group: { id: g.id, name: g.name } }));
          });
        }catch(e){}
      }));

      state.posts = allPosts;
      state.items = extractItems(allPosts);
      renderTree();
    }catch(err){
      location.replace('index.html');
    }
  }
  function updateModeButtons(){
    var isList = state.viewMode === 'list';
    $('btnModeList').classList.toggle('active', isList);
    $('btnModeList').setAttribute('aria-selected', isList);
    $('btnModeFolder').classList.toggle('active', !isList);
    $('btnModeFolder').setAttribute('aria-selected', !isList);
    var chipExpand = document.querySelector('[data-chip="expand"]');
    if(chipExpand) chipExpand.hidden = !isList;
  }

  function renderFolderMode(list, container){
    var byCourse = {};
    list.forEach(function(it){
      if(!byCourse[it.groupName]) byCourse[it.groupName] = { id: it.groupId, sessions: {} };
      var sKey = it.secMeet || 999;
      if(!byCourse[it.groupName].sessions[sKey]){
        byCourse[it.groupName].sessions[sKey] = { name: it.secName, meet: it.secMeet, items: [] };
      }
      byCourse[it.groupName].sessions[sKey].items.push(it);
    });

    var path = state.folderPath || [];
    container.innerHTML = '';

    var wrap = document.createElement('div');
    wrap.className = 'gdrive-wrap';

    // Breadcrumbs
    var crumbs = document.createElement('nav');
    crumbs.className = 'gdrive-crumbs';
    crumbs.setAttribute('aria-label', 'Breadcrumb');

    var rootBtn = document.createElement('button');
    rootBtn.type = 'button';
    rootBtn.className = path.length ? 'gdrive-crumb-btn' : 'gdrive-crumb-current';
    rootBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Drive</span>';
    if(path.length){
      rootBtn.onclick = function(){ state.folderPath = []; renderTree(); };
    }
    crumbs.appendChild(rootBtn);

    if(path.length >= 1){
      var sep1 = document.createElement('span');
      sep1.className = 'gdrive-crumb-sep';
      sep1.textContent = '›';
      crumbs.appendChild(sep1);

      var cName = path[0];
      var cBtn = document.createElement('button');
      cBtn.type = 'button';
      cBtn.className = path.length === 1 ? 'gdrive-crumb-current' : 'gdrive-crumb-btn';
      cBtn.textContent = cName;
      if(path.length > 1){
        cBtn.onclick = function(){ state.folderPath = [cName]; renderTree(); };
      }
      crumbs.appendChild(cBtn);
    }

    if(path.length >= 2){
      var sep2 = document.createElement('span');
      sep2.className = 'gdrive-crumb-sep';
      sep2.textContent = '›';
      crumbs.appendChild(sep2);

      var sKey = path[1];
      var sName = (byCourse[path[0]] && byCourse[path[0]].sessions[sKey])
        ? byCourse[path[0]].sessions[sKey].name
        : ('Sesi ' + sKey);
      var sSpan = document.createElement('span');
      sSpan.className = 'gdrive-crumb-current';
      sSpan.textContent = sName;
      crumbs.appendChild(sSpan);
    }

    wrap.appendChild(crumbs);

    // Level 0: Courses
    if(path.length === 0){
      var courseNames = Object.keys(byCourse).sort();
      if(!courseNames.length){
        wrap.innerHTML += '<div class="empty-state">Tidak ada folder mata kuliah.</div>';
        container.appendChild(wrap);
        return;
      }

      var head = document.createElement('div');
      head.className = 'gdrive-section-title';
      head.textContent = 'Mata Kuliah (' + courseNames.length + ')';
      wrap.appendChild(head);

      var grid = document.createElement('div');
      grid.className = 'gdrive-grid';

      courseNames.forEach(function(cName){
        var cData = byCourse[cName];
        var sKeys = Object.keys(cData.sessions);
        var fCount = sKeys.reduce(function(acc, k){ return acc + cData.sessions[k].items.length; }, 0);

        var card = document.createElement('div');
        card.className = 'gdrive-folder-card';
        card.innerHTML = '<div class="gdrive-folder-icon">' +
          '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fbbc04" stroke="#d56b00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' +
          '</div>' +
          '<div class="gdrive-folder-info">' +
            '<div class="gdrive-folder-name" title="' + cName + '">' + cName + '</div>' +
            '<div class="gdrive-folder-meta">' + sKeys.length + ' Sesi · ' + fCount + ' Berkas</div>' +
          '</div>' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);flex:0 0 auto"><polyline points="9 18 15 12 9 6"/></svg>';
        card.onclick = function(){
          state.folderPath = [cName];
          renderTree();
        };
        grid.appendChild(card);
      });
      wrap.appendChild(grid);

    // Level 1: Sessions
    }else if(path.length === 1){
      var cName = path[0];
      var cData = byCourse[cName];
      if(!cData){
        wrap.innerHTML += '<div class="empty-state">Folder ini kosong di kategori ini.<br><br><button class="btn-ghost" type="button" id="gdriveBackRoot">Kembali ke Drive</button></div>';
        container.appendChild(wrap);
        var b = $('gdriveBackRoot');
        if(b) b.onclick = function(){ state.folderPath = []; renderTree(); };
        return;
      }

      var sKeys = Object.keys(cData.sessions).map(Number).sort(function(a,b){
        return state.sort === 'sess-desc' ? b - a : a - b;
      });

      var head = document.createElement('div');
      head.className = 'gdrive-section-title';
      head.textContent = 'Folder Sesi / Pertemuan (' + sKeys.length + ')';
      wrap.appendChild(head);

      var grid = document.createElement('div');
      grid.className = 'gdrive-grid';

      sKeys.forEach(function(sKey){
        var sData = cData.sessions[sKey];
        var card = document.createElement('div');
        card.className = 'gdrive-folder-card';
        card.innerHTML = '<div class="gdrive-folder-icon">' +
          '<svg width="24" height="24" viewBox="0 0 24 24" fill="#4285f4" stroke="#1a73e8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' +
          '</div>' +
          '<div class="gdrive-folder-info">' +
            '<div class="gdrive-folder-name" title="' + sData.name + '">' + sData.name + '</div>' +
            '<div class="gdrive-folder-meta">' + sData.items.length + ' Berkas</div>' +
          '</div>' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);flex:0 0 auto"><polyline points="9 18 15 12 9 6"/></svg>';
        card.onclick = function(){
          state.folderPath = [cName, sKey];
          renderTree();
        };
        grid.appendChild(card);
      });
      wrap.appendChild(grid);

    // Level 2: Files in Session
    }else if(path.length === 2){
      var cName = path[0];
      var sKey = path[1];
      var cData = byCourse[cName];
      var sData = cData && cData.sessions[sKey];
      if(!sData || !sData.items.length){
        wrap.innerHTML += '<div class="empty-state">Tidak ada berkas di sesi ini.<br><br><button class="btn-ghost" type="button" id="gdriveBackCourse">Kembali ke Mata Kuliah</button></div>';
        container.appendChild(wrap);
        var b = $('gdriveBackCourse');
        if(b) b.onclick = function(){ state.folderPath = [cName]; renderTree(); };
        return;
      }

      var head = document.createElement('div');
      head.className = 'gdrive-section-title';
      head.textContent = 'Berkas (' + sData.items.length + ')';
      wrap.appendChild(head);

      var fileList = document.createElement('div');
      fileList.style.display = 'flex';
      fileList.style.flexDirection = 'column';
      fileList.style.gap = '8px';

      var items = sData.items.slice();
      if(state.sort === 'name-asc') items.sort(function(a,b){ return a.name.localeCompare(b.name); });
      else if(state.sort === 'date-desc') items.sort(function(a,b){ return b.createdAt - a.createdAt; });
      else if(state.sort === 'size-desc') items.sort(function(a,b){ return b.size - a.size; });

      items.forEach(function(item){
        fileList.appendChild(createFileRow(item, false));
      });
      wrap.appendChild(fileList);
    }

    container.appendChild(wrap);
  }

  $('btnModeList').onclick = function(){
    if(state.viewMode === 'list') return;
    state.viewMode = 'list';
    localStorage.setItem('edlink_files_mode', 'list');
    updateModeButtons();
    renderTree();
  };
  $('btnModeFolder').onclick = function(){
    if(state.viewMode === 'folder') return;
    state.viewMode = 'folder';
    state.folderPath = [];
    localStorage.setItem('edlink_files_mode', 'folder');
    updateModeButtons();
    renderTree();
  };


  $('viewerClose').onclick = function(){ cleanupViewer(); $('viewerModal').hidden = true; };
  $('viewerModal').onclick = function(e){ if(e.target === $('viewerModal')){ cleanupViewer(); $('viewerModal').hidden = true; } };

  // Category Tabs
  $('catTabs').addEventListener('click', function(e){
    var btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('#catTabs .tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    state.activeCat = btn.getAttribute('data-cat');
    renderTree();
  });

  // Search input
  var qInput = $('q');
  qInput.addEventListener('input', function(){
    state.q = qInput.value;
    $('qClear').hidden = !state.q;
    renderTree();
  });
  $('qClear').onclick = function(){
    qInput.value = '';
    state.q = '';
    $('qClear').hidden = true;
    renderTree();
  };

  // Filter dropdowns
  $('btnFilterToggle').onclick = function(){
    var p = $('filterPanel');
    p.hidden = !p.hidden;
    $('btnFilterToggle').classList.toggle('active', !p.hidden);
  };
  $('fCourse').onchange = function(){ state.courseFilter = this.value; renderTree(); };
  $('fSess').onchange   = function(){ state.sessFilter   = this.value; renderTree(); };
  $('fType').onchange   = function(){ state.typeFilter   = this.value; renderTree(); };
  $('fSort').onchange   = function(){ state.sort         = this.value; renderTree(); };

  // Chips
  document.querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){
      var action = c.getAttribute('data-chip');
      if(action === 'gdrive'){
        state.onlyGdrive = !state.onlyGdrive;
        c.classList.toggle('active', state.onlyGdrive);
        renderTree();
      }else if(action === 'expand'){
        state.allExpanded = !state.allExpanded;
        var txt = $('txtExpand');
        if(txt) txt.textContent = state.allExpanded ? 'Buka Semua Folder' : 'Tutup Semua Folder';
        document.querySelectorAll('details.course-card, details.sess-card').forEach(function(d){
          d.open = state.allExpanded;
        });
      }else if(action === 'reset'){
        state.q = ''; qInput.value = ''; $('qClear').hidden = true;
        state.courseFilter = ''; $('fCourse').value = '';
        state.sessFilter = ''; $('fSess').value = '';
        state.typeFilter = ''; $('fType').value = '';
        state.sort = 'sess-asc'; $('fSort').value = 'sess-asc';
        state.onlyGdrive = false;
        state.allExpanded = false;
        var txt = $('txtExpand');
        if(txt) txt.textContent = 'Buka Semua Folder';
        document.querySelector('[data-chip="gdrive"]').classList.remove('active');
        renderTree();
      }
    };
  });


  // Keyboard shortcut '/' to search
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== qInput){
      e.preventDefault();
      qInput.focus();
    }else if(e.key === 'Escape'){
      cleanupViewer();
      $('viewerModal').hidden = true;
    }
  });

  // Start
  loadData();
})();
</script>
</body>
</html>
